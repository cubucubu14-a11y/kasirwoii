name: Build APK Kasir-Woii

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. MEMBUAT KEYSTORE OTOMATIS
    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug

    # 2. RENAME FILE APK
    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kasir-Woii.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kasir-Woii-APK
        path: app/build/outputs/apk/debug/Kasir-Woii.apk

    # 3. HAPUS KEYSTORE AGAR TIDAK BOCOR
    - name: Clean up Keystore
      run: rm app/debug.keystore
