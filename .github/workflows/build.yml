name: Build APK Kasir-Woii

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug

    # TAMBAHAN BARU: RENAME FILE APK
    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kasir-Woii.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kasir-Woii-APK
        # Path diubah ke nama yang baru
        path: app/build/outputs/apk/debug/Kasir-Woii.apk
